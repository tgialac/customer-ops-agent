[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-ops-agent"
version = "0.1.0"
description = "An evaluation-first customer operations agent for fintech support workflows."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
openai = [
    "openai>=1.66,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
